# Konfiguration des Frontend-Containers.
#
# Der Container liefert die gebaute PWA aus und reicht zusaetzlich alle
# Anfragen unter /api an das Backend weiter -- inklusive WebSocket. Damit
# genuegt fuer einen Einzelplatz-Betrieb (z. B. als TrueNAS-App) ein einziger
# veroeffentlichter Port und ein zusaetzlicher Reverse Proxy ist entbehrlich.
# In der vollstaendigen Compose-Umgebung uebernimmt Caddy diese Aufgabe
# bereits davor; die Weiterleitung hier stoert dort nicht.

# Notwendig fuer die WebSocket-Aushandlung. "map" gehoert in den http-Kontext,
# in den diese Datei eingebunden wird.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Erzaehltexte koennen laenger werden als eine uebliche Antwort.
    client_max_body_size 10m;

    # Statische Dateien mit Hash im Namen duerfen lange im Cache bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker und Manifest muessen immer frisch geladen werden,
    # sonst bleibt eine alte Version der PWA haengen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Backend inklusive WebSocket.
    location /api/ {
        # Der Name wird zur Laufzeit aufgeloest (Dockers eingebautes DNS),
        # damit nginx auch startet, wenn das Backend noch nicht bereit ist.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Eine Rundenaufloesung wartet auf das Sprachmodell; die Vorgabe von
        # 60 Sekunden ist dafuer zu knapp.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Single-Page-Anwendung: alle uebrigen Routen liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
