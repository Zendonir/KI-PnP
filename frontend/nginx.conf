server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Statische Dateien mit Hash im Namen duerfen lange im Cache bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker und Manifest muessen immer frisch geladen werden,
    # sonst bleibt eine alte Version der PWA haengen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Single-Page-Anwendung: alle Routen liefern index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
