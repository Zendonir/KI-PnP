name: CI

# Prueft jeden Push und jeden Pull Request. Die Tests laufen gegen SQLite und
# den Offline-Spielleiter, brauchen also weder Docker noch API-Schluessel.

on:
  # Nur main: fuer Arbeitszweige greift bereits der pull_request-Ausloeser,
  # sonst liefe jede Pruefung doppelt.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Tests und statische Analyse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Abhaengigkeiten installieren
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Statische Analyse
        working-directory: backend
        run: ruff check app tests

      - name: Tests
        working-directory: backend
        run: pytest -q

      - name: Migration gegen die Modelle pruefen
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./drift-check.db
        run: |
          alembic upgrade head
          alembic revision --autogenerate -m "drift-check" >/dev/null
          # Erzeugt die Autogenerierung Operationen, weichen Modelle und
          # Migration voneinander ab -- das soll den Lauf rot faerben.
          if grep -rqE "op\.(create|drop|add|alter)" alembic/versions/*drift_check.py; then
            echo "::error::Migration und Modelle stimmen nicht ueberein."
            cat alembic/versions/*drift_check.py
            exit 1
          fi
          echo "Kein Schema-Drift."

  frontend:
    name: Frontend (Typpruefung und Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Typpruefung
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
