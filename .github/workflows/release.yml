name: Release-Images

# Baut die Container-Images und veroeffentlicht sie in der GitHub Container
# Registry (GHCR). Ausgeloest von jedem Tag "v*", jedem Push auf
# claude/ai-pen-paper-docker-wl6uzq oder von Hand ueber "Run workflow".
#
# Achtung: jeder dieser Laeufe markiert das Image zusaetzlich als ":latest"
# (siehe docker-metadata-action unten) -- unabhaengig vom Branch. Ein Push
# auf claude/ai-pen-paper-docker-wl6uzq ueberschreibt also bewusst das
# produktiv gezogene ":latest"-Image mit dem jeweils neuesten Stand dieses
# Entwicklungsbranches. Das ist Absicht (siehe Commit-Historie), nicht
# versehentlich -- wer stattdessen nur bei Versions-Tags oder auf main
# veroeffentlichen will, muss den push-Branch-Trigger unten entsprechend
# anpassen oder entfernen.
#
# TrueNAS SCALE laeuft ausschliesslich auf x86-64, deshalb wird bewusst nur
# linux/amd64 gebaut. Fuer weitere Architekturen genuegt es, "platforms" um
# z. B. linux/arm64 zu ergaenzen (verlaengert den Lauf deutlich).

on:
  push:
    tags: ["v*"]
    branches: ["claude/ai-pen-paper-docker-wl6uzq"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.component }}-Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Angezeigte Version ermitteln
        id: app_version
        # Aus backend/pyproject.toml -- derselben Quelle, die auch zur
        # Laufzeit ueber importlib.metadata gelesen wird. Der Bezeichner des
        # Docker-Images (steps.meta.outputs.version) eignet sich dafuer
        # nicht: bei "workflow_dispatch" ohne neuen Tag liefert die
        # Prioritaet der metadata-action dort das Wort "latest" -- die
        # Oberflaeche zeigte dann "vlatest", waehrend /api/health weiterhin
        # die echte Paketversion nennt. Beide sollen immer uebereinstimmen.
        run: |
          version=$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bezeichner und Beschriftungen ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=KI-PnP ${{ matrix.component }}
            org.opencontainers.image.description=KI-gestuetzte Pen-&-Paper-Plattform
            org.opencontainers.image.licenses=NOASSERTION

      - name: Bauen und veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_APP_VERSION=${{ steps.app_version.outputs.version }}

      - name: Ergebnis zusammenfassen
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "Veroeffentlichte Bezeichner:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
